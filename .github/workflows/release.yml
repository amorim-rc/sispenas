name: Publicar Release

# Publicação AUTOMÁTICA: quando um push na main traz uma versão nova em
# package.json (para a qual ainda não há Release), cria a Release do GitHub e a
# tag vX.Y.Z usando o texto de release-notes/*-vX.Y.Z.md.
#
# Assim, fechar uma versão é só: subir a versão no package.json + escrever a
# release note, e mergear. Sem `git push origin vX.Y.Z` manual (que já bagunçou
# uma vez). É idempotente: se a Release da versão corrente já existe, não faz nada.
#
# `workflow_dispatch` permite re-rodar à mão (ex.: depois de apagar uma Release
# malformada) sem precisar de um novo commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Ver a nota em regen-data.yml: o Environment restringe os secrets do app à
    # `main`, do lado do servidor. Aqui o token do app é o que permite criar a
    # tag quando o ruleset de tags proíbe criação por atores comuns.
    environment: automacao
    steps:
      - name: Token do app de automação (quando configurado)
        id: app
        if: vars.APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node 24 importa os arquivos .ts das entradas nativamente (type stripping),
      # sem precisar de `npm ci` — as entradas não têm dependências de runtime.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Versão e corpo da Release
        id: rn
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "existe=1" >> "$GITHUB_OUTPUT"
            echo "Release $TAG já existe — nada a publicar."
            exit 0
          fi
          echo "existe=0" >> "$GITHUB_OUTPUT"
          # A nota grande é o acúmulo das entradas do changelog daquela versão.
          node scripts/montar-nota-release.mjs "$TAG" > corpo.md 2>/dev/null
          echo "Corpo montado para $TAG:"
          cat corpo.md

      - name: Criar a Release (cria também a tag no commit atual)
        if: steps.rn.outputs.existe == '0'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          gh release create "${{ steps.rn.outputs.tag }}" \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.rn.outputs.tag }}" \
            --notes-file corpo.md
