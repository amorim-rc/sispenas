name: Regenerar dados derivados

# Quando data/crimes.json muda (inclusive via edição pela interface web do GitHub),
# roda scripts/transform_data.py e commita o static/data/crimes.json regenerado.
# Assim não é preciso rodar Python localmente para atualizar o catálogo.

on:
  push:
    branches: [main]
    paths:
      - 'data/crimes.json'
      - 'scripts/transform_data.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regen-data
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    # O Environment é a trava SERVER-SIDE dos secrets do app: com a política de
    # branch restrita à `main`, o GitHub recusa entregar a chave a um job que
    # rode em qualquer outra branch. Sem isso, bastaria a um colaborador com
    # write empurrar uma branch com o workflow adulterado para usar o app —
    # `if:` no YAML e CODEOWNERS não impedem execução fora da main.
    environment: automacao
    steps:
      # O token do app é o que atravessa o ruleset da main (o github-actions[bot]
      # não é ator selecionável no bypass). Enquanto o app não existir, o passo é
      # pulado e tudo segue com o token padrão — o repositório nunca fica preso.
      - name: Token do app de automação (quando configurado)
        id: app
        if: vars.APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerar catálogo derivado
        run: python3 scripts/transform_data.py

      - name: Commitar mudanças (se houver)
        run: |
          if [ -n "$(git status --porcelain static/data/crimes.json)" ]; then
            git config user.name "sispenas-bot"
            git config user.email "sispenas-bot@users.noreply.github.com"
            git add static/data/crimes.json
            git commit -m "chore(data): regenera static/data/crimes.json [skip ci]"
            git push
          else
            echo "Nenhuma mudança no catálogo derivado."
          fi
