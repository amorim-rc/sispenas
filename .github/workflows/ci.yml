name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Typecheck, verificação e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: npm ci

      # Regenera o derivado e falha se o catálogo tiver MAIS contradições do que o
      # débito conhecido (0 — todas resolvidas). O catálogo pode melhorar, não
      # piorar. Ao resolver contradições, baixe --max-contradicoes na mesma medida.
      # Também impõe: todo registro é tipo penal, e todo id é único e append-only.
      - name: Validar catálogo de tipos penais
        run: python3 scripts/transform_data.py --estrito --max-contradicoes=0

      # O derivado é commitado; se a transformação mudar o resultado, o PR está
      # desatualizado (o workflow regen-data.yml o regenera após o merge).
      - name: Conferir se static/data/crimes.json está atualizado
        run: git diff --exit-code --stat static/data/crimes.json

      # Parser do conferidor: roda só contra as fixtures congeladas em
      # scripts/crawler/fixtures — sem rede, portanto sem depender do Planalto
      # estar no ar. O download ao vivo é exclusividade do workflow semanal.
      - name: Testar o parser do conferidor
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest scripts/crawler/tests -q

      # Entrada do changelog não pode anunciar versão que nunca foi publicada:
      # o bump por substituição de texto já falhou em silêncio três vezes, e o
      # feed ficou prometendo v1.2.16 a v1.2.18 com o projeto em 1.2.15.
      - name: Conferir coerência do changelog
        run: node scripts/validar-changelog.mjs

      - name: Typecheck
        run: npm run typecheck

      # Invariantes do motor de benefícios + casos-âncora de direito penal,
      # avaliados contra o catálogo real de tipos penais.
      - name: Verificar motor de benefícios
        run: npm run verificar

      - name: Build
        run: npm run build
